name: 每日站点构建与发布

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00（GitHub Actions 的 cron 一律按 UTC 计算）
    # 注意：整点是 GitHub 调度负载最高的时刻，实际触发可能顺延数十分钟至数小时
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-site-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git 提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建并发布（抓取数据 + 构建静态站 + 提交推送）
        run: bash tools/ai-trend/deploy.sh
