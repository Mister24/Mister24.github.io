name: 每日站点构建与发布

on:
  # 定时触发改由外部调度（WorkBuddy 每日 08:00 定时任务调用 workflow_dispatch），
  # 不再使用 GitHub 原生 schedule —— 其调度在免费/公开仓库会延迟到中午，且会与外部触发重复构建。
  workflow_dispatch:

concurrency:
  group: daily-site-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git 提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建并发布（抓取数据 + 构建静态站 + 提交推送）
        run: bash tools/ai-trend/deploy.sh
