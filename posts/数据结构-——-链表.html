<article class="post"><a class="back" href="/posts/">← 博客归档</a><h1>数据结构 —— 链表.md</h1><div class="date">2020-02-15</div><p>&amp;nbsp;&amp;nbsp;链表使用非连续存储单元来存储数据，每个数据元素，除了标识本身存储信息之外，还包含了一个指向后续数据元素的指针，这两部分信息共同组成了一个结点（Node）。存储数据信息的域叫做数据域，存储直系那个后续数据元素的域叫做指针域。n个结点相连，组成了链表。</p></article>
